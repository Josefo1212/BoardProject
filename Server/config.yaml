server:
  host: "0.0.0.0"
  port: 3005
  maxClients: 50
  pingIntervalMs: 30000
  maxPayloadBytes: 262144
  maxBufferedBytes: 8388608

access:
  mode: "allowlist"
  allowedOrigins:
    - "*"
  allowedIps:
    # IP de esta laptop (servidor) en la red WiFi actual.
    - "192.168.137.50"
    # Agrega aqui la IP de cada equipo autorizado, por ejemplo:
    - "192.168.137.51"

limits:
  maxStrokes: 5000
  maxPointsPerStroke: 10000
  maxTotalPoints: 2000000
  maxMessagesPerSecond: 500

persistence:
  enabled: true
  file: "data/board.json"
  debounceMs: 500
