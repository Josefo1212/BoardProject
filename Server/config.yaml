server:
  host: "0.0.0.0"
  port: 3005
  maxClients: 50
  pingIntervalMs: 30000
  maxPayloadBytes: 262144
  maxBufferedBytes: 8388608

access:
  # "open" deja entrar a cualquier equipo de la misma red WiFi.
  # Usa "allowlist" solo si vas a mantener al dia la lista de IPs; si la IP
  # del router cambia (DHCP), las laptops quedan bloqueadas con codigo 1008.
  mode: "open"
  allowedOrigins:
    - "*"
  # Solo se usan cuando mode es "allowlist". 127.0.0.1 y ::1 siempre se permiten.
  allowedIps: []

limits:
  maxStrokes: 5000
  maxPointsPerStroke: 10000
  maxTotalPoints: 2000000
  maxMessagesPerSecond: 500

persistence:
  enabled: true
  file: "data/board.json"
  debounceMs: 500
